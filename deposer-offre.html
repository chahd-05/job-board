<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déposer une offre — MERN Jobs</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="header-container">

            <a class="logo" href="index.html">MERN Jobs</a>

            <nav>
                <ul class="nav-list">
                    <li><a href="index.html">offres</a></li>
                    <li><a href="offres-suivies.html">offres suivies</a></li>
                    <li><a href="deposer-offre.html">deposer une offre</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <main>

        <section class="offer-form-section">

            <h1>deposer une opportunite</h1>

            <p class="section-description">
                Remplissez ce formulaire pour publier une offre de stage ou d'alternance
            </p>

            <form class="offer-form" action="#" method="post">

                <div class="form-group">
                    <label for="title">titre du poste</label>
                    <input
                        id="title"
                        type="text"
                        placeholder="ex: developpeur react.js junior"
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="company">nom de l'entreprise</label>
                        <input
                            id="company"
                            type="text"
                            placeholder="ex: techcorp"
                        >
                    </div>

                    <div class="form-group">
                        <label for="city">ville</label>
                        <input
                            id="city"
                            type="text"
                            placeholder="ex: casablanca"
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label for="contract">type de contrat</label>

                    <select id="contract">
                        <option value="">selectionner</option>
                        <option value="stage">stage</option>
                        <option value="alternance">alternance</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="technologies">Technologies principales</label>

                    <input
                        id="technologies"
                        type="text"
                        placeholder="ex: react, node.js, mongodb"
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description de la mission *</label>

                    <textarea
                        id="description"
                        placeholder="Décrivez les tâches et objectifs du poste..."
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="application">Lien ou Email de candidature</label>

                    <input
                        id="application"
                        type="text"
                        placeholder="ex: RH@techcorp.ma ou https://link.com"
                    >
                </div>

                <button class="submit-button" type="submit">
                    publier l'offre
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Promotion MERN. Tous droits réservés.</p>
    </footer>

</body>
</html>
